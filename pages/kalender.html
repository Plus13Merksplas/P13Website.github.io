<!doctype html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <title>Kalender - Plus 13 Merksplas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* Basis achtergrond van de pagina voor een zachter contrast */
        body {
            background-color: #f8f9fa; /* Zeer lichtgrijs, kijkt rustiger dan puur wit */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .section-anchor {
            scroll-margin-top: 90px;
        }

        /* Pagina Titel (Agenda) in logokleur */
        .titel-agenda {
            color: #007b8f; /* Vermoedelijke logokleur uit de code */
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Witte achtergrond en harde borders van de wrapper verwijderd */
        #kalender-lijst-wrapper {
            background-color: transparent;
            padding: 1rem;
            max-width: 800px;
            margin: 0 auto; /* Centreert de kalender mooi */
        }

        /* Maand kopjes moderniseren met een subtiel lijntje */
        .maand-kop {
            color: #007b8f;
            font-weight: 700;
            font-size: 1.5rem;
            margin-top: 2.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        /* Modern kort accentlijntje onder de maand in plaats van een lijn over de hele breedte */
        .maand-kop::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 40px;
            height: 4px;
            background-color: #add8e6;
            border-radius: 2px;
        }

        .maand-kop:first-child {
            margin-top: 0;
        }

        /* Evenementen rij: Zonder harde border, met mooi hover effect */
        .event-rij {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            background-color: transparent;
            border-left: 4px solid #007b8f; /* Mooie accentlijn links */
            transition: all 0.3s ease; /* Zorgt voor een soepele animatie */
        }

        /* Als de muis erover gaat, krijgt hij een witte achtergrond en een schaduw */
        .event-rij:hover {
            background-color: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px); /* Laat het blokje heel licht 'opwippen' */
        }

        /* Datumblokje: Donker vlak weg, nu fris en licht */
        .event-datum {
            color: #007b8f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
        }

        .event-datum .dag {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: -2px;
        }

        .event-datum .maand {
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            color: #6c757d; /* Neutraal grijs zodat de dag eruit knalt */
        }

        .event-inhoud {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .event-naam {
            font-weight: 700;
            color: #222c34; /* Donkergrijs in plaats van pikzwart voor minder vermoeide ogen */
            font-size: 1.15rem;
            margin-bottom: 0.2rem;
        }

        /* Info details gecombineerd (Tijd & Locatie) */
        .event-details {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .event-details i {
            color: #007b8f;
            margin-right: 5px;
        }

        #kalender-status {
            font-size: 0.95rem;
            color: #6c757d;
            text-align: center;
            padding: 2rem 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <!-- De titel zoals je vroeg in de logokleur -->
        <h1 class="titel-agenda">Agenda</h1>

        <div id="kalender-lijst-wrapper">
            
            <div class="maand-kop">September</div>

            <!-- Voorbeeld van een activiteit met het nieuwe design -->
            <div class="event-rij">
                <div class="event-datum">
                    <span class="dag">25</span>
                    <span class="maand">sep</span>
                </div>
                <div class="event-inhoud">
                    <div class="event-naam">Startactiviteit Plus 13</div>
                    <div class="event-details">
                        <span><i class="fas fa-clock"></i> 14:00 - 17:00</span>
                        <span><i class="fas fa-map-marker-alt"></i> Jeugdlokaal Merksplas</span>
                    </div>
                </div>
            </div>

            <div class="event-rij">
                <div class="event-datum">
                    <span class="dag">02</span>
                    <span class="maand">okt</span>
                </div>
                <div class="event-inhoud">
                    <div class="event-naam">Filmavond & Snacks</div>
                    <div class="event-details">
                        <span><i class="fas fa-clock"></i> 19:30 - 22:00</span>
                        <span><i class="fas fa-map-marker-alt"></i> De Spil</span>
                    </div>
                </div>
            </div>

            <div id="kalender-status">Geen verdere activiteiten gepland.</div>
        </div>
    </div>

</body>
</html>
