<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Escape Room Terminal</title>
    <style>
        body {
            font-family: monospace;
            background-color: #000000;
            color: #00ff00;
            padding: 20px;
        }
        
        #chatbox {
            width: 100%;
            height: 300px;
            border: 1px solid #00ff00;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            background-color: #111111;
        }

        #bericht-input {
            width: 70%;
            padding: 10px;
            background-color: #000000;
            color: #00ff00;
            border: 1px solid #00ff00;
            font-family: monospace;
            font-size: 16px;
        }

        #verzenden-btn {
            padding: 10px 20px;
            background-color: #00ff00;
            color: #000000;
            border: none;
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
        }

        #verzenden-btn:hover {
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="login-status" style="margin-bottom: 15px; font-weight: bold;"></div>

    <div id="chatbox"></div>

    <div>
        <input type="text" id="bericht-input" placeholder="Voer bericht in..." autocomplete="off">
        <button id="verzenden-btn">Verzenden</button>
    </div>

    <script type="module">
        // --- 1. BEVEILIGING EN USERNAME CHECK ---
        const savedUsername = localStorage.getItem("username");
        const savedRole = localStorage.getItem("role");

        // Als er geen naam en geen admin is, schop ze terug naar index.html
        if (!savedUsername && savedRole !== "admin") {
            window.location.href = "index.html";
        }

        // Bepaal de weergavenaam voor in de database en op het scherm
        const displayName = savedRole === "admin" ? "Admin" : savedUsername;
        document.getElementById('login-status').innerText = "INGELOGD ALS: " + displayName.toUpperCase();

        // --- 2. FIREBASE SETUP ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCj_i-KUABcpzNdLdgQiexILUOJRkOt94Y",
            authDomain: "escape-room-plussertjes.firebaseapp.com",
            databaseURL: "https://escape-room-plussertjes-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "escape-room-plussertjes",
            storageBucket: "escape-room-plussertjes.firebasestorage.app",
            messagingSenderId: "881613293314",
            appId: "1:881613293314:web:30861cf618d25f835a241b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const berichtenRef = ref(db, 'berichten');

        const chatbox = document.getElementById('chatbox');
        const inputVeld = document.getElementById('bericht-input');
        const verzendKnop = document.getElementById('verzenden-btn');

        // --- CAESAR CIPHER FUNCTIE ---
        const caesarVerschuiving = 3; 

        function versleutel(tekst, verschuiving) {
            return tekst.replace(/[a-zA-Z]/g, function(letter) {
                const basis = letter <= 'Z' ? 65 : 97;
                return String.fromCharCode(((letter.charCodeAt(0) - basis + verschuiving) % 26 + 26) % 26 + basis);
            });
        }

        // --- BERICHTEN VERSTUREN EN ONTVANGEN ---
        function verstuurBericht() {
            const tekst = inputVeld.value.trim();
            if (tekst !== "") {
                push(berichtenRef, {
                    afzender: displayName, // Hier gaat de naam uit de pop-up de database in!
                    inhoud: tekst
                });
                inputVeld.value = ""; 
            }
        }

        verzendKnop.addEventListener('click', verstuurBericht);
        inputVeld.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verstuurBericht();
        });

        // Luister naar berichten via Firebase
        onChildAdded(berichtenRef, (snapshot) => {
            const berichtData = snapshot.val();
            const berichtDiv = document.createElement('div');
            
            if (berichtData.afzender === displayName) {
                // Wat je ZELF typt: blijft onversleuteld en wit
                berichtDiv.innerHTML = `<strong>${berichtData.afzender}:</strong> ${berichtData.inhoud}`;
                berichtDiv.style.color = "#ffffff";
            } else {
                // Wat de ANDER typt: wordt versleuteld met de Caesar Cipher en rood
                const versleuteldeTekst = versleutel(berichtData.inhoud, caesarVerschuiving);
                berichtDiv.innerHTML = `<strong style="color: #ff3333;">${berichtData.afzender}:</strong> ${versleuteldeTekst}`;
            }
            
            chatbox.appendChild(berichtDiv);
            chatbox.scrollTop = chatbox.scrollHeight;
        });
    </script>

</body>
</html>
